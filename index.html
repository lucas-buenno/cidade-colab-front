<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D6FF3E" />
    <meta
      name="description"
      content="Cidade Colab — plataforma de colaborações urbanas."
    />
    <title>Cidade Colab</title>
    <script>
      (function () {
        var key = "cidadecolab:theme";
        var pref = null;
        try {
          pref = localStorage.getItem(key);
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        if (dark) {
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", "#121212");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
